server:
  port: 8088
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/notification_db
    username: ${POSTGRES_USER:hiresphere}
    password: ${POSTGRES_PASSWORD:hiresphere}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}

hiresphere:
  mail:
    from: ${MAIL_FROM:no-reply@hiresphere.local}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
