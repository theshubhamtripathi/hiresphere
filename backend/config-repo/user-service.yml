server:
  port: 8081
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/user_db
    username: ${POSTGRES_USER:hiresphere}
    password: ${POSTGRES_PASSWORD:hiresphere}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true

hiresphere:
  admin:
    email: ${ADMIN_EMAIL:admin@hiresphere.local}
    password: ${ADMIN_PASSWORD:Admin@12345}
