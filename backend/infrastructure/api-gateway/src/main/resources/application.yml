spring:
  application:
    name: api-gateway
  config:
    import: ${CONFIG_IMPORT:optional:configserver:http://localhost:8888}

# server.port and the route table are served by the Config Server (api-gateway.yml).
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

# Fallback defaults so the gateway can start (and tests load) without the Config Server.
hiresphere:
  jwt:
    secret: ${JWT_SECRET:change-me-dev-secret-at-least-64-bytes-long-0123456789abcdefghijklmnop}
    issuer: hiresphere
