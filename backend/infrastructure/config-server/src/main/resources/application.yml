spring:
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          # Candidate locations; the ones that exist are used. Covers running
          # from the module dir, the backend reactor, or a Docker image.
          search-locations: >-
            ${CONFIG_REPO_LOCATIONS:file:./config-repo,file:../../config-repo,file:../config-repo,classpath:/config-repo}

server:
  port: 8888

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
