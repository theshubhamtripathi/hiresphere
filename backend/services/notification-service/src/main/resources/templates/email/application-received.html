<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"/></head>
<body style="font-family:Arial,Helvetica,sans-serif;background:#f4f6fb;margin:0;padding:24px;">
<div style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:12px;overflow:hidden;border:1px solid #e5e9f2;">
    <div style="background:#2563eb;color:#ffffff;padding:20px 28px;font-size:20px;font-weight:bold;">HireSphere</div>
    <div style="padding:28px;color:#1f2937;line-height:1.6;">
        <div th:if="${forEmployer}">
            <h2 style="margin-top:0;">New application received</h2>
            <p><strong th:text="${applicant}">A candidate</strong> applied for
                <strong th:text="${jobTitle}">your job</strong>.</p>
            <p>Review the candidate, screen them with AI and move them through your hiring pipeline.</p>
        </div>
        <div th:unless="${forEmployer}">
            <h2 style="margin-top:0;">Application submitted</h2>
            <p>Hi <span th:text="${name}">there</span>, your application for
                <strong th:text="${jobTitle}">the role</strong> was received. We'll notify you of any updates.</p>
        </div>
        <p style="text-align:center;margin:28px 0;">
            <a th:href="${url}" style="background:#2563eb;color:#fff;text-decoration:none;padding:12px 24px;border-radius:8px;">View in HireSphere</a>
        </p>
    </div>
</div>
</body>
</html>
