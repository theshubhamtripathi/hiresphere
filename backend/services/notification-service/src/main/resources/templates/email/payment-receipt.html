<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"/></head>
<body style="font-family:Arial,Helvetica,sans-serif;background:#f4f6fb;margin:0;padding:24px;">
<div style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:12px;overflow:hidden;border:1px solid #e5e9f2;">
    <div style="background:#2563eb;color:#ffffff;padding:20px 28px;font-size:20px;font-weight:bold;">HireSphere</div>
    <div style="padding:28px;color:#1f2937;line-height:1.6;">
        <h2 style="margin-top:0;">Payment successful</h2>
        <p>Thank you for your payment. Your subscription is now active.</p>
        <table style="width:100%;border-collapse:collapse;margin:16px 0;">
            <tr><td style="padding:8px 0;color:#6b7280;">Plan</td><td style="text-align:right;font-weight:bold;" th:text="${plan}">PRO</td></tr>
            <tr><td style="padding:8px 0;color:#6b7280;">Amount</td><td style="text-align:right;font-weight:bold;"><span th:text="${currency}">INR</span> <span th:text="${amount}">0</span></td></tr>
        </table>
        <p style="text-align:center;margin:28px 0;">
            <a th:href="${url}" style="background:#2563eb;color:#fff;text-decoration:none;padding:12px 24px;border-radius:8px;">View billing</a>
        </p>
    </div>
</div>
</body>
</html>
