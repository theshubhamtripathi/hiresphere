<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"/></head>
<body style="font-family:Arial,Helvetica,sans-serif;background:#f4f6fb;margin:0;padding:24px;">
<div style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:12px;overflow:hidden;border:1px solid #e5e9f2;">
    <div style="background:#2563eb;color:#ffffff;padding:20px 28px;font-size:20px;font-weight:bold;">HireSphere</div>
    <div style="padding:28px;color:#1f2937;line-height:1.6;">
        <h2 style="margin-top:0;">Welcome<span th:if="${name}" th:text="', ' + ${name}"></span>!</h2>
        <p>Your HireSphere account is ready. Explore jobs, build your resume and apply with AI-assisted
            cover letters — all in one place.</p>
        <p style="text-align:center;margin:28px 0;">
            <a th:href="${url}" style="background:#2563eb;color:#fff;text-decoration:none;padding:12px 24px;border-radius:8px;">Get started</a>
        </p>
    </div>
    <div style="padding:16px 28px;color:#9ca3af;font-size:12px;border-top:1px solid #eef1f6;">You are receiving this because you signed up for HireSphere.</div>
</div>
</body>
</html>
