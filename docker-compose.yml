name: hiresphere

# Full stack. Start order is enforced via healthchecks:
#   infra -> discovery -> config -> business services -> gateway
# Bring everything up:   docker compose up -d --build
# Admin tooling (kafka-ui): docker compose --profile tools up -d

x-service-env: &service-env
  EUREKA_URI: http://discovery-server:8761/eureka
  CONFIG_IMPORT: configserver:http://config-server:8888
  DB_HOST: postgres
  DB_PORT: 5432
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  REDIS_HOST: redis
  REDIS_PORT: 6379
  POSTGRES_USER: ${POSTGRES_USER:-hiresphere}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hiresphere}
  JWT_SECRET: ${JWT_SECRET:-change-me-dev-secret-at-least-64-bytes-long-0123456789abcdefghijklmnop}
  JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-900000}
  JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-604800000}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
  RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
  RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
  RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
  MAIL_HOST: mailpit
  MAIL_PORT: 1025
  MAIL_FROM: ${MAIL_FROM:-no-reply@hiresphere.local}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@hiresphere.local}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@12345}
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}

x-service-deps: &service-deps
  config-server:
    condition: service_healthy
  postgres:
    condition: service_healthy
  kafka:
    condition: service_healthy

services:
  # ---------- Infrastructure ----------
  postgres:
    image: postgres:17-alpine
    container_name: hs-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hiresphere}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hiresphere}
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hiresphere} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: hs-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.9.1
    container_name: hs-kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    container_name: hs-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: hs-kafka-ui
    profiles: ["tools"]
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8100:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: hiresphere
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    restart: unless-stopped

  # ---------- Platform services ----------
  discovery-server:
    build:
      context: ./backend
      args:
        JAR: infrastructure/discovery-server/target/discovery-server-1.0.0.jar
    container_name: hs-discovery
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20
    mem_limit: 400m
    restart: unless-stopped

  config-server:
    build:
      context: ./backend
      args:
        JAR: infrastructure/config-server/target/config-server-1.0.0.jar
    container_name: hs-config
    environment:
      EUREKA_URI: http://discovery-server:8761/eureka
      CONFIG_REPO_LOCATIONS: file:/config-repo
    depends_on:
      discovery-server:
        condition: service_healthy
    ports:
      - "8888:8888"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20
    mem_limit: 400m
    restart: unless-stopped

  user-service:
    build: {context: ./backend, args: {JAR: services/user-service/target/user-service-1.0.0.jar}}
    container_name: hs-user
    environment: *service-env
    depends_on: *service-deps
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 20
    mem_limit: 450m
    restart: unless-stopped

  company-service:
    build: {context: ./backend, args: {JAR: services/company-service/target/company-service-1.0.0.jar}}
    container_name: hs-company
    environment: *service-env
    depends_on: *service-deps
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 20
    mem_limit: 450m
    restart: unless-stopped

  job-service:
    build: {context: ./backend, args: {JAR: services/job-service/target/job-service-1.0.0.jar}}
    container_name: hs-job
    environment: *service-env
    depends_on: *service-deps
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 20
    mem_limit: 450m
    restart: unless-stopped

  resume-service:
    build: {context: ./backend, args: {JAR: services/resume-service/target/resume-service-1.0.0.jar}}
    container_name: hs-resume
    environment: *service-env
    depends_on: *service-deps
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 20
    mem_limit: 450m
    restart: unless-stopped

  application-service:
    build: {context: ./backend, args: {JAR: services/application-service/target/application-service-1.0.0.jar}}
    container_name: hs-application
    environment: *service-env
    depends_on: *service-deps
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 20
    mem_limit: 450m
    restart: unless-stopped

  job-preference-service:
    build: {context: ./backend, args: {JAR: services/job-preference-service/target/job-preference-service-1.0.0.jar}}
    container_name: hs-preference
    environment: *service-env
    depends_on: *service-deps
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 20
    mem_limit: 450m
    restart: unless-stopped

  ai-service:
    build: {context: ./backend, args: {JAR: services/ai-service/target/ai-service-1.0.0.jar}}
    container_name: hs-ai
    environment: *service-env
    depends_on: *service-deps
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8087/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 20
    mem_limit: 450m
    restart: unless-stopped

  notification-service:
    build: {context: ./backend, args: {JAR: services/notification-service/target/notification-service-1.0.0.jar}}
    container_name: hs-notification
    environment: *service-env
    depends_on: *service-deps
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 20
    mem_limit: 450m
    restart: unless-stopped

  payment-service:
    build: {context: ./backend, args: {JAR: services/payment-service/target/payment-service-1.0.0.jar}}
    container_name: hs-payment
    environment: *service-env
    depends_on: *service-deps
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8089/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 20
    mem_limit: 450m
    restart: unless-stopped

  analytics-service:
    build: {context: ./backend, args: {JAR: services/analytics-service/target/analytics-service-1.0.0.jar}}
    container_name: hs-analytics
    environment: *service-env
    depends_on: *service-deps
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 20
    mem_limit: 450m
    restart: unless-stopped

  api-gateway:
    build: {context: ./backend, args: {JAR: infrastructure/api-gateway/target/api-gateway-1.0.0.jar}}
    container_name: hs-gateway
    environment:
      <<: *service-env
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 20
    mem_limit: 450m
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
